<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0000">
  <meta name="robots" content="noindex, nofollow">
  <title>Segredo da Mulher Desejada 40+ — Aula</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("assets/fonts/CormorantGaramond-wght.ttf") format("truetype");
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Cormorant Garamond";
      src: url("assets/fonts/CormorantGaramond-Italic-wght.ttf") format("truetype");
      font-weight: 300 700;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: "Source Sans 3";
      src: url("assets/fonts/SourceSans3-wght.woff2") format("woff2");
      font-weight: 200 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --wine-1000: #070000;
      --wine-950: #0e0000;
      --wine-900: #160000;
      --wine-800: #2a0002;
      --wine-700: #8a1010;
      --crimson: #c41216;
      --crimson-light: #ef403f;
      --ivory: #fbf6ef;
      --cream: #f4e6d4;
      --paper: #f7eee3;
      --gold: #c49a4a;
      --gold-light: #e4c98a;
      --ink: #1a0505;
      --ink-soft: #6b4545;
      --white: #fffdf8;
      --display: "Cormorant Garamond", Georgia, serif;
      --body: "Source Sans 3", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: #050000;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--white);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .presentation {
      display: grid;
      min-height: 100svh;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      justify-items: center;
      padding: 12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% -25%, rgba(196, 18, 22, 0.22), transparent 38%),
        #050000;
    }

    .deck-shell {
      display: grid;
      width: min(100%, calc((100svh - 78px) * 16 / 9));
      max-height: calc(100svh - 78px);
      aspect-ratio: 16 / 9;
      place-items: stretch;
      overflow: hidden;
      border: 1px solid rgba(228, 201, 138, 0.25);
      background: var(--wine-950);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.68);
      container-type: inline-size;
    }

    .slide {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      overflow: hidden;
      padding: 5.4cqw 6.2cqw 4.8cqw;
    }

    .slide::before,
    .slide::after {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    .slide::before {
      inset: 0;
    }

    .slide::after {
      inset: 1.25cqw;
      border: 1px solid rgba(228, 201, 138, 0.14);
    }

    .theme-lesson.tone-dark {
      color: var(--white);
      background:
        radial-gradient(circle at 78% 26%, rgba(196, 18, 22, 0.24), transparent 24%),
        radial-gradient(circle at 14% 86%, rgba(196, 154, 74, 0.12), transparent 27%),
        linear-gradient(132deg, var(--wine-950) 0%, var(--wine-900) 58%, var(--wine-800) 100%);
    }

    .theme-lesson.tone-dark::before {
      opacity: 0.3;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
      background-size: 4.2cqw 4.2cqw;
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent 92%);
      mask-image: linear-gradient(to bottom, #000, transparent 92%);
    }

    .theme-lesson.tone-light {
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(196, 18, 22, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, var(--ivory), var(--paper));
      background-size: 5cqw 5cqw, auto;
    }

    .theme-lesson.tone-light::before {
      inset: auto -3cqw -16cqw auto;
      width: 42cqw;
      height: 42cqw;
      border: 1px solid rgba(138, 16, 16, 0.09);
      border-radius: 50%;
      box-shadow: 0 0 0 5cqw rgba(138, 16, 16, 0.025), 0 0 0 10cqw rgba(196, 154, 74, 0.02);
    }

    .theme-lesson.tone-light::after {
      border-color: rgba(138, 16, 16, 0.12);
    }

    .theme-pitch {
      color: #fff;
      background:
        radial-gradient(circle at 76% 24%, rgba(238, 36, 38, 0.2), transparent 24%),
        radial-gradient(circle at 18% 78%, rgba(196, 154, 74, 0.1), transparent 28%),
        linear-gradient(118deg, #030000 0%, #100000 48%, #350003 100%);
    }

    .theme-pitch::before {
      opacity: 0.23;
      background:
        linear-gradient(117deg, transparent 0 23%, rgba(228, 201, 138, 0.12) 23.1% 23.2%, transparent 23.3% 72%, rgba(228, 201, 138, 0.1) 72.1% 72.2%, transparent 72.3%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 4px);
    }

    .theme-pitch::after {
      border-color: rgba(239, 64, 63, 0.34);
      box-shadow: inset 0 0 0 0.4cqw rgba(0, 0, 0, 0.2);
    }

    .slide-brand {
      position: absolute;
      z-index: 3;
      top: 2.15cqw;
      right: 2.7cqw;
      display: flex;
      align-items: center;
      min-height: 2.2cqw;
    }

    .brand-event {
      width: 14.6cqw;
      height: auto;
      filter: drop-shadow(0 0.5cqw 0.8cqw rgba(0, 0, 0, 0.36));
    }

    .tone-light .brand-event {
      filter: none;
    }

    .brand-sdd {
      width: 10.5cqw;
      height: auto;
      filter: drop-shadow(0 0.5cqw 0.9cqw rgba(0, 0, 0, 0.65));
    }

    .slide-section {
      position: absolute;
      top: 2.35cqw;
      left: 3cqw;
      display: flex;
      align-items: center;
      gap: 0.75cqw;
      color: var(--gold-light);
      font-size: 0.78cqw;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .tone-light .slide-section {
      color: var(--wine-700);
    }

    .slide-section::before {
      width: 2.2cqw;
      height: 1px;
      background: currentColor;
      content: "";
    }

    .slide-number {
      position: absolute;
      right: 2.7cqw;
      bottom: 2.05cqw;
      color: rgba(255, 253, 248, 0.48);
      font-size: 0.85cqw;
      font-variant-numeric: tabular-nums;
      font-weight: 720;
      letter-spacing: 0.12em;
    }

    .tone-light .slide-number {
      color: rgba(26, 5, 5, 0.48);
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 0.85cqw;
      margin: 0 0 1.05cqw;
      color: var(--gold-light);
      font-size: 0.83cqw;
      font-weight: 820;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .kicker::before {
      width: 2.4cqw;
      height: 1px;
      background: currentColor;
      content: "";
    }

    .tone-light .kicker {
      color: var(--crimson);
    }

    h1,
    h2,
    p,
    ul,
    ol,
    blockquote {
      margin-top: 0;
    }

    .display {
      max-width: 12.5ch;
      margin-bottom: 1.25cqw;
      font-family: var(--display);
      font-size: 5.6cqw;
      font-weight: 520;
      line-height: 0.9;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    .display.medium {
      font-size: 4.65cqw;
      line-height: 0.94;
    }

    .display.small {
      font-size: 3.8cqw;
      line-height: 0.96;
    }

    .title {
      max-width: 17ch;
      margin-bottom: 1.65cqw;
      font-family: var(--display);
      font-size: 4.35cqw;
      font-weight: 560;
      line-height: 0.95;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 44ch;
      margin-bottom: 1.4cqw;
      color: rgba(255, 253, 248, 0.75);
      font-size: 1.5cqw;
      line-height: 1.38;
      text-wrap: balance;
    }

    .tone-light .subtitle,
    .tone-light .body-copy {
      color: var(--ink-soft);
    }

    .body-copy {
      color: rgba(255, 253, 248, 0.78);
      font-size: 1.42cqw;
      line-height: 1.44;
    }

    .body-copy strong,
    .subtitle strong {
      color: inherit;
      font-weight: 790;
    }

    .accent-red {
      color: var(--crimson-light);
    }

    .accent-gold {
      color: var(--gold-light);
    }

    .tone-light .accent-gold {
      color: #8a5e13;
    }

    .italic {
      font-family: var(--display);
      font-style: italic;
    }

    .rule {
      width: 5.5cqw;
      height: 2px;
      margin: 1.45cqw 0;
      background: linear-gradient(90deg, var(--crimson), var(--gold-light));
    }

    .stage-copy {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: center;
    }

    .centered {
      align-items: center;
      text-align: center;
    }

    .centered .display,
    .centered .title,
    .centered .subtitle,
    .centered .body-copy {
      margin-right: auto;
      margin-left: auto;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2.8cqw;
      align-items: center;
      width: 100%;
    }

    .columns.top {
      align-items: start;
    }

    .columns.wide-right {
      grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr);
    }

    .columns.wide-left {
      grid-template-columns: minmax(0, 1.18fr) minmax(0, 0.82fr);
    }

    .list {
      display: grid;
      gap: 0.75cqw;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .list li {
      position: relative;
      padding-left: 1.8cqw;
      color: rgba(255, 253, 248, 0.82);
      font-size: 1.33cqw;
      font-weight: 560;
      line-height: 1.32;
    }

    .list li::before {
      position: absolute;
      top: 0.62em;
      left: 0;
      width: 0.52cqw;
      height: 0.52cqw;
      border: 1px solid var(--gold-light);
      border-radius: 50%;
      background: rgba(196, 18, 22, 0.55);
      content: "";
      transform: translateY(-50%);
    }

    .tone-light .list li {
      color: var(--ink);
    }

    .tone-light .list li::before {
      border-color: var(--crimson);
      background: rgba(196, 154, 74, 0.42);
    }

    .list.compact {
      gap: 0.48cqw;
    }

    .list.compact li {
      font-size: 1.15cqw;
      line-height: 1.25;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9cqw;
    }

    .cards.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      min-width: 0;
      padding: 1.25cqw 1.35cqw;
      border: 1px solid rgba(228, 201, 138, 0.22);
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.14);
    }

    .tone-light .card {
      border-color: rgba(138, 16, 16, 0.13);
      background: rgba(255, 253, 248, 0.86);
      box-shadow: 0 1.2cqw 2.4cqw rgba(22, 0, 0, 0.055);
    }

    .card-number {
      display: block;
      margin-bottom: 0.55cqw;
      color: var(--gold-light);
      font-size: 0.77cqw;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .tone-light .card-number {
      color: var(--crimson);
    }

    .card h3 {
      margin: 0 0 0.52cqw;
      font-family: var(--display);
      font-size: 2cqw;
      font-weight: 620;
      line-height: 1;
    }

    .card p {
      margin: 0;
      color: rgba(255, 253, 248, 0.72);
      font-size: 1.06cqw;
      line-height: 1.35;
    }

    .tone-light .card p {
      color: var(--ink-soft);
    }

    .quote {
      max-width: 26ch;
      margin: 0;
      font-family: var(--display);
      font-size: 3.25cqw;
      font-style: italic;
      font-weight: 430;
      line-height: 1.04;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .quote::before {
      display: block;
      margin-bottom: 0.55cqw;
      color: var(--crimson-light);
      font-size: 4.6cqw;
      font-style: normal;
      line-height: 0.45;
      content: "“";
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.58cqw;
      margin-top: 1.2cqw;
    }

    .pill {
      padding: 0.48cqw 0.82cqw;
      border: 1px solid rgba(228, 201, 138, 0.26);
      border-radius: 99px;
      color: var(--cream);
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.88cqw;
      font-weight: 700;
    }

    .tone-light .pill {
      border-color: rgba(138, 16, 16, 0.18);
      color: var(--wine-700);
      background: rgba(255, 255, 255, 0.72);
    }

    .closing-line {
      margin-top: 1.5cqw;
      padding-top: 1.2cqw;
      border-top: 1px solid rgba(228, 201, 138, 0.22);
      color: var(--white);
      font-family: var(--display);
      font-size: 2.05cqw;
      font-weight: 580;
      line-height: 1.06;
      text-wrap: balance;
    }

    .tone-light .closing-line {
      border-top-color: rgba(138, 16, 16, 0.16);
      color: var(--ink);
    }

    .portrait-frame {
      position: relative;
      height: 35cqw;
      overflow: hidden;
      border: 1px solid rgba(228, 201, 138, 0.35);
      border-radius: 1.2cqw 10cqw 1.2cqw 1.2cqw;
      background: var(--wine-950);
      box-shadow: 0 2cqw 5cqw rgba(0, 0, 0, 0.4);
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
    }

    .hero-event-layout {
      display: grid;
      height: 100%;
      grid-template-columns: minmax(0, 1.06fr) minmax(0, 0.94fr);
      gap: 2.6cqw;
      align-items: center;
    }

    .hero-logo {
      width: min(100%, 38cqw);
      height: auto;
      margin-bottom: 1.55cqw;
      filter: drop-shadow(0 0.9cqw 1.8cqw rgba(0, 0, 0, 0.55));
    }

    .hero-photo {
      position: absolute;
      top: -5.4cqw;
      right: -6.2cqw;
      bottom: -4.8cqw;
      width: 52cqw;
      overflow: hidden;
      border-left: 1px solid rgba(228, 201, 138, 0.26);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 100%);
    }

    .hero-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      opacity: 0.84;
    }

    .hero-photo::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(14, 0, 0, 0.72), transparent 45%), linear-gradient(0deg, rgba(14, 0, 0, 0.3), transparent 46%);
      content: "";
    }

    .oversized-word {
      position: absolute;
      z-index: 0;
      right: -0.7cqw;
      bottom: -1.7cqw;
      color: rgba(228, 201, 138, 0.055);
      font-family: var(--display);
      font-size: 12cqw;
      font-weight: 700;
      line-height: 0.8;
      letter-spacing: -0.06em;
      pointer-events: none;
      text-transform: uppercase;
    }

    .tone-light .oversized-word {
      color: rgba(138, 16, 16, 0.055);
    }

    .stacked-words {
      display: grid;
      gap: 0.12cqw;
      font-family: var(--display);
      font-size: 4.45cqw;
      font-weight: 550;
      line-height: 0.9;
      letter-spacing: -0.035em;
    }

    .stacked-words span:nth-child(2) {
      color: var(--crimson-light);
      transform: translateX(3cqw);
    }

    .stacked-words span:nth-child(3) {
      transform: translateX(6cqw);
    }

    .big-impact {
      max-width: 12ch;
      font-family: var(--display);
      font-size: 5.1cqw;
      font-weight: 540;
      line-height: 0.9;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .formula {
      display: grid;
      gap: 0.7cqw;
      padding: 1.4cqw 1.55cqw;
      border-left: 0.3cqw solid var(--crimson);
      background: rgba(255, 255, 255, 0.045);
    }

    .tone-light .formula {
      background: rgba(255, 255, 255, 0.7);
    }

    .formula strong {
      color: var(--gold-light);
      font-size: 0.83cqw;
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .tone-light .formula strong {
      color: var(--crimson);
    }

    .formula p {
      margin: 0;
      font-family: var(--display);
      font-size: 1.85cqw;
      font-weight: 580;
      line-height: 1.1;
    }

    .versus {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1.15cqw;
      align-items: stretch;
    }

    .versus-mark {
      align-self: center;
      color: var(--crimson-light);
      font-family: var(--display);
      font-size: 1.35cqw;
      font-style: italic;
      font-weight: 650;
    }

    .role-cloud {
      display: flex;
      max-width: 48cqw;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7cqw;
      margin: 0 auto 1.8cqw;
    }

    .role-cloud span {
      padding: 0.62cqw 1cqw;
      border: 1px solid rgba(228, 201, 138, 0.25);
      color: var(--cream);
      font-size: 1.04cqw;
      font-weight: 720;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.85cqw;
      margin-top: 1.5cqw;
    }

    .step {
      position: relative;
      min-height: 10.6cqw;
      padding: 1.2cqw;
      border-top: 0.24cqw solid var(--crimson);
      background: rgba(255, 255, 255, 0.055);
    }

    .step:nth-child(2) { transform: translateY(-0.6cqw); }
    .step:nth-child(3) { transform: translateY(-1.2cqw); }
    .step:nth-child(4) { transform: translateY(-1.8cqw); }

    .step b {
      display: block;
      margin-bottom: 2cqw;
      color: var(--gold-light);
      font-size: 0.8cqw;
      letter-spacing: 0.14em;
    }

    .step span {
      display: block;
      font-family: var(--display);
      font-size: 1.95cqw;
      font-weight: 620;
      line-height: 0.98;
    }

    .testimonial-placeholder {
      display: grid;
      min-height: 18cqw;
      place-items: center;
      padding: 3cqw;
      border: 1px dashed rgba(196, 18, 22, 0.42);
      background: rgba(255, 255, 255, 0.58);
      text-align: center;
    }

    .testimonial-placeholder strong {
      display: block;
      color: var(--crimson);
      font-size: 0.84cqw;
      font-weight: 850;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .testimonial-placeholder p {
      max-width: 43ch;
      margin: 0.8cqw 0 0;
      color: var(--ink-soft);
      font-family: var(--display);
      font-size: 2.2cqw;
      line-height: 1.08;
    }

    .product-reveal {
      display: grid;
      height: 100%;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: 3.2cqw;
      align-items: center;
    }

    .product-logo-large {
      width: 30cqw;
      max-width: 100%;
      height: auto;
      margin: 0 0 1.1cqw;
      filter: drop-shadow(0 0.8cqw 1.3cqw rgba(0, 0, 0, 0.64));
    }

    .product-cover {
      position: absolute;
      top: -2cqw;
      right: 2.7cqw;
      width: 27.8cqw;
      filter: drop-shadow(0 2cqw 3.5cqw rgba(0, 0, 0, 0.62));
    }

    .product-cover-card {
      position: relative;
      display: grid;
      min-height: 35cqw;
      place-items: center;
    }

    .product-cover-card::before,
    .product-cover-card::after {
      position: absolute;
      width: 23cqw;
      height: 31.5cqw;
      border: 1px solid rgba(228, 201, 138, 0.22);
      content: "";
      transform: rotate(5deg);
    }

    const slideElement = document.getElementById("slide");
    const currentElement = document.getElementById("current-slide");
    const totalElement = document.getElementById("total-slides");
    const previousButton = document.getElementById("previous");
    const nextButton = document.getElementById("next");
    const fullscreenButton = document.getElementById("fullscreen");
    const helpElement = document.getElementById("help");
    let currentIndex = 0;
    let touchStartX = null;

    function clamp(value, minimum, maximum) {
      return Math.min(Math.max(value, minimum), maximum);
    }

    function indexFromHash() {
      const match = window.location.hash.match(/^#slide-(\d{1,2})$/);
      if (!match) return 0;
      return clamp(Number(match[1]) - 1, 0, slides.length - 1);
    }

    function brandMarkup(slide) {
      if (slide.brand === false) return "";
      if (slide.theme === "pitch") {
        return '<img class="brand-sdd" src="assets/logo-sdd.png" alt="Sexo das Deusas">';
      }
      return '<img class="brand-event" src="assets/logo-evento.png" alt="Segredo da Mulher Desejada 40+">';
    }

    function renderSlide(index, updateHash = true) {
      currentIndex = clamp(index, 0, slides.length - 1);
      const slide = slides[currentIndex];
      const number = String(currentIndex + 1).padStart(2, "0");

      slideElement.className = `slide theme-${slide.theme} tone-${slide.tone || "dark"}`;
      slideElement.setAttribute("aria-label", `Slide ${currentIndex + 1} de ${slides.length}: ${slide.section}`);
      slideElement.innerHTML = `
        <div class="slide-section">${slide.section}</div>
        <div class="slide-brand">${brandMarkup(slide)}</div>
        ${slide.content}
        <div class="slide-number">${number} / ${String(slides.length).padStart(2, "0")}</div>`;

      currentElement.textContent = number;
      previousButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === slides.length - 1;
      document.title = `${number} · ${slide.section} — Segredo da Mulher Desejada 40+`;

      if (updateHash) {
        history.replaceState(null, "", `#slide-${currentIndex + 1}`);
      }
    }

    function previousSlide() {
      renderSlide(currentIndex - 1);
    }

    function nextSlide() {
      renderSlide(currentIndex + 1);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    function showHelp() {
      helpElement.classList.add("is-visible");
      window.setTimeout(() => helpElement.classList.remove("is-visible"), 1800);
    }

    previousButton.addEventListener("click", previousSlide);
    nextButton.addEventListener("click", nextSlide);
    fullscreenButton.addEventListener("click", toggleFullscreen);

    window.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown"].includes(event.key) || event.key === " ") {
        event.preventDefault();
        nextSlide();
      } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        previousSlide();
      } else if (event.key === "Home") {
        event.preventDefault();
        renderSlide(0);
      } else if (event.key === "End") {
        event.preventDefault();
        renderSlide(slides.length - 1);
      } else if (event.key.toLowerCase() === "f") {
        event.preventDefault();
        toggleFullscreen();
      } else if (event.key === "?") {
        showHelp();
      }
    });

    slideElement.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    slideElement.addEventListener("touchend", (event) => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(delta) < 45) return;
      if (delta < 0) nextSlide();
      else previousSlide();
    }, { passive: true });

    window.addEventListener("hashchange", () => renderSlide(indexFromHash(), false));
    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.setAttribute("aria-label", document.fullscreenElement ? "Sair da tela cheia" : "Entrar em tela cheia");
    });

    totalElement.textContent = String(slides.length).padStart(2, "0");
    renderSlide(indexFromHash(), false);
  </script>
