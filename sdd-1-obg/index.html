<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obrigada pela sua compra</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #ffffff;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
    }

    .msg {
      max-width: 560px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.7;
      color: #111111;
    }

    .msg p + p {
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="page">
  <div class="msg">
    <p>✅ Obrigada pela sua compra!</p>
    <p>🎉 Seu pedido foi processado com sucesso.</p>
    <p>📩 Verifique sua caixa de entrada de e-mail e seu whatsapp (e também a pasta de spam ou promoções, por precaução)!</p>
  </div>
</div>

</body>
</html>
