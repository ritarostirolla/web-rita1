server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript image/svg+xml;

  # Cache de assets estáticos
  location ~* \.(avif|webp|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Cada pasta = slug da página (/papo-calcinha → papo-calcinha/index.html)
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
