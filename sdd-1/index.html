<script>
  (function () {
    var agora = new Date();
    var dd = String(agora.getDate()).padStart(2, '0');
    var mm = String(agora.getMonth() + 1).padStart(2, '0');
    var yyyy = agora.getFullYear();
    var el = document.getElementById('aviso-sair');
    if (el) {
      el.textContent = 'Atenção: Esse vídeo vai sair do ar no dia ' + dd + '/' + mm + '/' + yyyy + ' às 23:59.';
    }
  })();
</script>

<script>
  (function () {
    var el = document.getElementById('live-viewers-count');
    if (!el) return;
    var min = 268;
    var max = 327;
    var current = 295;
    el.textContent = String(current);
    function tick() {
      var delta = Math.floor(Math.random() * 11) - 5;
      current = Math.min(max, Math.max(min, current + delta));
      el.textContent = String(current);
      setTimeout(tick, 2500 + Math.floor(Math.random() * 2500));
    }
    setTimeout(tick, 3000);
  })();
</script>

<script>
